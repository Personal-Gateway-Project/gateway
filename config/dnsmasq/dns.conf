# Task 10: log every DNS query to a file, for the DNS watcher (later task).
# extra adds a serial number and the client address to each line.
log-queries=extra
log-facility=/var/log/dnsmasq.log

# Cap the TTL handed to clients at 5 minutes, so they ask again before
# their entry in the app sets (timeout 10m) expires.
max-ttl=300
