name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shellcheck
        run: shellcheck install.sh
      - name: Ruff
        run: |
          pip install ruff
          ruff check .
      - name: Pytest
        run: |
          pip install pytest
          pytest
      - name: Nft syntax check
        run: |
          sudo apt-get update
          sudo apt-get install -y nftables
          sudo nft -c -f tests/samples/minimal.nft